[package]
name = "radium"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, experimental package manager for JavaScript/TypeScript projects"
publish = false
default-run = "radium"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
json5 = "0.4"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4.46"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
